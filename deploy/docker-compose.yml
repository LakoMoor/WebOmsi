# A public WebOmsi server on any machine with Docker and a domain name pointing at it:
#
#   DOMAIN=play.example.com SERVER_NAME="My WebOmsi server" docker compose -f deploy/docker-compose.yml up -d --build
#
# Caddy gets the TLS certificate by itself (ports 80 and 443 must be open), the server speaks
# WebSocket behind it, and `announce` lists it in the public list of the start screen.
services:
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      SERVER_NAME: "${SERVER_NAME:-WebOmsi server}"
      SERVER_MOTD: "${SERVER_MOTD:-Welcome! Drive safely.}"
      MAX_PLAYERS: "${MAX_PLAYERS:-16}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN to your domain name} --to server:27025
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data]
    depends_on: [server]
  announce:
    image: alpine:3.20
    restart: unless-stopped
    command: sh -c "apk add --no-cache curl >/dev/null && /announce.sh https://${DOMAIN}"
    environment: { STATUS_URL: "http://server:27025/status" }
    volumes: ["./announce.sh:/announce.sh:ro"]
    depends_on: [server]
volumes:
  caddy_data:
