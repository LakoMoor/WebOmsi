[package]
name = "omsi-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio: cpal mixer with pitch/gain/3D voices, WAV loading, and the OMSI sound-config runtime (unit mc_sound)"

[dependencies]
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-cfg = { path = "../omsi-cfg" }
cpal = "0.15"
parking_lot.workspace = true
hashbrown.workspace = true
glam.workspace = true
log.workspace = true
anyhow.workspace = true
# internet radio: MP3 / AAC / Ogg streams over HTTP(S)
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "vorbis"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

# the browser build plays through Web Audio
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }

[dev-dependencies]
env_logger.workspace = true
