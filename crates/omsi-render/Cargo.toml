[package]
name = "omsi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer: textured, lit meshes with OMSI alpha modes; on-screen and off-screen targets"

[dependencies]
web-time = "1"
omsi-cfg = { path = "../omsi-cfg" }
omsi-geometry = { path = "../omsi-geometry" }
omsi-texture = { path = "../omsi-texture" }
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
rayon.workspace = true
hashbrown.workspace = true
log.workspace = true
anyhow.workspace = true
winit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[dev-dependencies]
naga = { version = "29", features = ["spv-out", "glsl-out"] }
