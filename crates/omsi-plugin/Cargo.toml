[package]
name = "omsi-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OMSI plugins: the .opl files of the plugins folder and their DLLs, driven as OMSI drives them"

[dependencies]
web-time = "1"
log.workspace = true

# loading DLLs and Lua: only on a computer
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[[bin]]
name = "omsi-plugin-host"
path = "src/bin/omsi-plugin-host.rs"
