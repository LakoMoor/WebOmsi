# WebOmsi: builds the game for the browser and publishes the page on GitHub Pages.
#
#   https://<user>.github.io/<repo>/          the game (web/, the game as WebAssembly, the demo pack)
#   https://<user>.github.io/<repo>/engine/   the engine's own website and documentation (site/, docs/)
#
# The game's content is NOT OMSI 2's: the demo pack is generated here by tools/public (CC0).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TOOLCHAIN: "1.97.1"
  RUSTFLAGS: --cfg getrandom_backend="wasm_js"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$TOOLCHAIN"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: webomsi-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: webomsi-${{ runner.os }}-

      - name: wasm-bindgen
        run: command -v wasm-bindgen || cargo +"$TOOLCHAIN" install wasm-bindgen-cli --version 0.2.128 --locked

      # the engine is one big crate: the runner's 7 GB are not enough without swap
      - name: Swap
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build the game for the browser
        env:
          JOBS: "2"
        run: ./build-web.sh web

      - name: The demo pack (original content, generated)
        run: tools/public/build.sh

      - name: Assemble the site
        run: |
          mkdir -p _site/engine/docs _site/engine/assets
          cp web/index.html web/main.js web/zipscan.js web/style.css web/icon.svg web/config.json web/.nojekyll web/demo-pack.zip _site/
          cp -R web/pkg _site/pkg
          cp -R site/. _site/engine/
          cp docs/*.md _site/engine/docs/
          cp -R assets/logos _site/engine/assets/logos
          cp assets/icons/app/openomsi-256.png _site/engine/assets/icon.png
          cp assets/icons/app/openomsi.svg _site/engine/assets/icon.svg
          test ! -e _site/pack.zip          # OMSI 2's files are never published
          du -sh _site _site/pkg

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
